<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Widescreen Planner & Backup System</title>
    <style>
        :root { 
            --bg-desk: #1e2b38; 
            --page-color: #fdfcf9; 
            --text-main: #222; 
            --gold-accent: #b89742; 
            --green-accent: #4a5d3f; 
            --border-light: #d1d1d1; 
            
            --tile-header-bg: #f4f4f4;
            --tile-header-text: #555;
            --active-tab-bg: #b89742;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-desk); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .planner-workspace { 
            position: relative; width: 90vw; max-width: 1600px; height: 92vh; max-height: 950px; 
            display: flex; flex-direction: row; box-shadow: 0 25px 50px rgba(0,0,0,0.6); 
            border-radius: 12px; background-color: var(--page-color);
        }

        .page-container { 
            flex: 1; position: relative; padding: 30px 45px; 
            display: flex; flex-direction: column; overflow: hidden; border-radius: 12px;
        }

        .tabs { position: absolute; right: -42px; top: 3%; bottom: 3%; display: flex; flex-direction: column; gap: 3px; list-style: none; z-index: 5; width: 42px; }
        .tab { flex: 1; background-color: var(--page-color); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; border: 1px solid var(--border-light); border-left: none; border-radius: 0 8px 8px 0; box-shadow: 3px 2px 5px rgba(0,0,0,0.15); cursor: pointer; transition: all 0.2s ease; }
        .tab span { writing-mode: vertical-rl; text-orientation: mixed; }
        .tab.active { background-color: var(--active-tab-bg); color: #fff; width: 52px; font-weight: bold; }
        .tab.special { background-color: #34495e; color: white; }

        .content-block { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        .content-block.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .scroll-area { flex: 1; overflow-y: auto; padding-right: 8px; display: flex; flex-direction: column; }

        .header { flex-shrink: 0; border-bottom: 2px solid var(--active-tab-bg); padding-bottom: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; background-color: var(--page-color); transition: border-color 0.3s;}
        
        .cursive-title {
            font-family: 'Snell Roundhand', 'Apple Chancery', 'Brush Script MT', 'Lucida Handwriting', 'Segoe Print', cursive;
            font-size: 3.2rem !important;
            text-transform: none !important;
            font-weight: 600;
            letter-spacing: 1px !important;
            color: var(--text-main);
            margin: 0;
            line-height: 1;
            padding-bottom: 4px;
        }

        .back-btn { color: #666; cursor: pointer; font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; display: inline-block; transition: color 0.2s; }
        .back-btn:hover { color: var(--active-tab-bg); }
        
        .header-controls { display: flex; gap: 10px; align-items: center; }
        
        .theme-select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-weight: 600; font-size: 0.9rem; cursor: pointer; outline: none; background: #fff;}
        .theme-select:focus { border-color: var(--active-tab-bg); }

        .btn-action { background-color: var(--active-tab-bg); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s, background 0.2s; letter-spacing: 0.5px; }
        .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-secondary { background-color: #6c757d; }

        .simple-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 1px; background: #e5e5e5; flex: 1; border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 10px; }
        
        .cal-tile { background: #fff; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; transition: background 0.1s; }
        .cal-tile:hover { background-color: #f7f5ed; }
        .cal-tile.muted { background-color: #fafafa; cursor: default; }
        .cal-tile.muted:hover { background-color: #fafafa; }
        
        .tile-header-area { background-color: var(--tile-header-bg); color: var(--tile-header-text); padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.3s, color 0.3s;}
        .tile-date { font-weight: 700; font-size: 0.95rem; text-transform: uppercase; }
        
        .tile-content-area { padding: 10px 12px; flex: 1; overflow-y: auto; }
        .tile-previews { font-size: 0.85rem; color: #444; line-height: 1.5; }
        .tile-task-snippet { color: var(--green-accent); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; font-weight: 500;}
        .tile-note-snippet { color: var(--gold-accent); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; font-weight: 500;}

        .day-block { margin-bottom: 25px; }
        .block-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border-light); padding-bottom: 6px; margin-bottom: 12px; }
        .block-header h3 { font-size: 0.95rem; color: var(--text-main); letter-spacing: 1px; font-weight: 600; text-transform: uppercase; margin: 0;}
        
        .carry-over-btn { background: #eee; color: #555; border: 1px solid #ccc; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: all 0.2s; }
        .carry-over-btn:hover { background: var(--active-tab-bg); color: white; border-color: var(--active-tab-bg); }

        .task-item { display: flex; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed #e5e5e5; }
        .task-item input[type="checkbox"] { margin-right: 12px; margin-top: 4px; transform: scale(1.3); accent-color: var(--green-accent); cursor: pointer; flex-shrink: 0; }
        
        .note-item { display: flex; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed #e5e5e5; }
        .note-item::before { content: '•'; color: var(--gold-accent); font-size: 1.8rem; line-height: 1.1rem; margin-right: 10px; }
        
        .entry-content-wrapper { flex: 1; display: flex; flex-direction: column; transition: opacity 0.2s; min-width: 0; }
        .entry-title { font-size: 1.05rem; font-weight: 600; color: #222; margin-bottom: 3px; transition: text-decoration 0.2s; word-wrap: break-word; }
        .entry-details { font-size: 0.95rem; color: #555; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .item-tags { margin-left: 12px; font-size: 0.75rem; color: #555; background: #e8e8e8; padding: 3px 8px; border-radius: 8px; flex-shrink: 0; margin-top: 2px; font-weight: 600; align-self: flex-start;}

        /* --- NEW: DELETE BUTTON STYLES --- */
        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 1.5rem;
            cursor: pointer;
            margin-left: 15px;
            padding: 0 8px;
            transition: color 0.2s;
            line-height: 1;
            align-self: flex-start;
        }
        .delete-btn:hover {
            color: #dc143c;
        }

        .dynamic-input-group { display: flex; flex-direction: column; width: 100%; margin-top: 10px; background: #fff; border: 2px solid var(--gold-accent); border-radius: 8px; padding: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); transition: border-color 0.2s; }
        .dynamic-input-group:focus-within { border-color: var(--green-accent); }
        .dynamic-title-input { width: 100%; border: none; border-bottom: 1px dashed #ccc; font-size: 1.1rem; font-weight: bold; color: #333; padding-bottom: 8px; margin-bottom: 8px; outline: none; }
        .dynamic-title-input::placeholder { font-weight: normal; color: #999; }
        .dynamic-details-input { width: 100%; border: none; font-size: 1rem; color: #444; outline: none; resize: none; min-height: 60px; max-height: 250px; overflow-y: auto; line-height: 1.4; }
        .dynamic-details-input::placeholder { color: #999; }

        .page-nav-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 15px; margin-top: auto; padding-bottom: 10px; flex-shrink: 0; }
        .nav-btn { background: #f4f4f4; color: #444; border: 1px solid #ccc; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .nav-btn:hover { background: var(--active-tab-bg); color: white; border-color: var(--active-tab-bg); }

        .input-bar { flex-shrink: 0; background: white; padding: 12px 20px; border-radius: 10px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-light); display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 15px; z-index: 20; }
        .tag-label { color: #555; font-size: 0.9rem; font-weight: 600; margin-right: auto; }
        .input-bar select { width: 140px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; flex-shrink: 0; font-weight: 500;}
        .btn-task, .btn-note { border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; white-space: nowrap; transition: background-color 0.2s; }
        .btn-task { background-color: var(--green-accent); color: white; }
        .btn-note { background-color: var(--gold-accent); color: #fff; }
        .btn-task:hover { background-color: #3b4b31; }
        .btn-note:hover { background-color: #a38235; }
    </style>
</head>
<body>

    <div class="planner-workspace">
        <div class="page-container" id="main-container">
            <div class="scroll-area" id="content-area"></div>
            
            <div class="input-bar" id="inputBar" style="display:none;">
                <span class="tag-label">Tag:</span>
                <select id="entryTag">
                    <option value="General">General</option>
                    <option value="Ideas">Ideas</option>
                    <option value="Maintenance">Maintenance</option>
                </select>
                <button class="btn-task" id="btn-add-task" onclick="toggleInput('task')">+ Action Item</button>
                <button class="btn-note" id="btn-add-note" onclick="toggleInput('note')">+ Note</button>
            </div>
        </div>

        <ul class="tabs">
            <li class="tab active" id="tab-aug" onclick="loadMonth('aug')"><span>AUGUST</span></li>
            <li class="tab special" id="tab-search" onclick="loadSearchPage()"><span>🔍</span></li>
        </ul>
    </div>

    <!-- HIDDEN TEMPLATES -->
    <div id="hidden-templates" style="display:none;">
        
        <div id="data-empty-day">
            <div class="header">
                <div class="header-title-group" style="width: 100%; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <div class="back-btn" onclick="loadMonth('aug')">⟵ Back to Calendar</div>
                        <h2 id="dynamic-day-title">Date</h2>
                    </div>
                    
                    <div class="header-controls" id="day-override-control">
                        <select class="theme-select" id="overrideThemeSelect" onchange="overrideDayColor(this.value)">
                            <!-- Populated via JS -->
                        </select>
                    </div>
                </div>
            </div>
            <div class="scroll-area">
                <div class="day-block tasks-container">
                    <div class="block-header">
                        <h3>Action Items</h3>
                        <button class="carry-over-btn" id="btn-carry-over">⤑ Carry Over Unfinished</button>
                    </div>
                </div>
                <div class="day-block notes-container">
                    <div class="block-header">
                        <h3>Notes & Log</h3>
                    </div>
                </div>
                <div class="page-nav-bar" id="dynamic-page-nav"></div>
            </div>
        </div>

        <div id="data-search-page">
            <div class="header">
                <div class="header-title-group">
                    <div class="back-btn" onclick="loadMonth('aug')">⟵ Back to Calendar</div>
                    <h2>Global Search & Archive</h2>
                </div>
            </div>
            <div class="scroll-area">
                <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="globalSearchInput" class="dynamic-title-input" placeholder="Search by name, tag, or keyword..." oninput="runGlobalSearch()" style="border-bottom: 2px solid var(--active-tab-bg); padding: 10px; font-size: 1.1rem;">
                </div>
                <div id="searchResultsContainer" style="display: flex; flex-direction: column; gap: 12px;">
                    <p style="color: #777; font-size: 1rem; font-style: italic;">Type above to search all records and ideas...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden File Input for Restoring Backups -->
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="processImportFile(event)">

    <script>
        let currentActiveId = "aug-grid"; 
        let activeInputType = null;
        let augustData = {};
        
        const themePalette = {
            'default': { bg: '#f4f4f4', text: '#555', tab: '#b89742' },
            'slate':   { bg: '#708090', text: '#fff', tab: '#4a5568' },
            'crimson': { bg: '#dc143c', text: '#fff', tab: '#8b0000' },
            'ocean':   { bg: '#4682b4', text: '#fff', tab: '#274e7d' },
            'emerald': { bg: '#50c878', text: '#fff', tab: '#2e7d48' },
            'amethyst':{ bg: '#9966cc', text: '#fff', tab: '#5c3a82' },
            'coral':   { bg: '#ff7f50', text: '#fff', tab: '#b34d26' },
            'mustard': { bg: '#ffdb58', text: '#333', tab: '#b39420' },
            'teal':    { bg: '#008080', text: '#fff', tab: '#004d4d' },
            'navy':    { bg: '#000080', text: '#fff', tab: '#00004d' },
            'olive':   { bg: '#808000', text: '#fff', tab: '#4d4d00' },
            'rose':    { bg: '#ff007f', text: '#fff', tab: '#99004c' }
        };

        const themeOptionsHtml = `
            <option value="default">Default</option>
            <option value="slate">Slate</option>
            <option value="crimson">Crimson</option>
            <option value="ocean">Ocean</option>
            <option value="emerald">Emerald</option>
            <option value="amethyst">Amethyst</option>
            <option value="coral">Coral</option>
            <option value="mustard">Mustard</option>
            <option value="teal">Teal</option>
            <option value="navy">Navy</option>
            <option value="olive">Olive</option>
            <option value="rose">Rose</option>
        `;

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = 'Please remember to download a backup before closing the planner.';
        });

        window.onload = () => {
            const saved = localStorage.getItem('augustStructuredData');
            if (saved) augustData = JSON.parse(saved);
            
            const savedTheme = localStorage.getItem('globalTileTheme') || 'default';
            applyGlobalThemeVars(savedTheme);
            
            loadMonth('aug');
        };

        function applyGlobalThemeVars(colorKey) {
            const theme = themePalette[colorKey] || themePalette['default'];
            document.documentElement.style.setProperty('--tile-header-bg', theme.bg);
            document.documentElement.style.setProperty('--tile-header-text', theme.text);
            document.documentElement.style.setProperty('--active-tab-bg', theme.tab);
        }

        function changeGlobalTheme(colorKey) {
            applyGlobalThemeVars(colorKey);
            localStorage.setItem('globalTileTheme', colorKey);
        }

        function overrideDayColor(colorKey) {
            if (!currentActiveId.includes('-d')) return;
            if (!augustData[currentActiveId]) augustData[currentActiveId] = { tasks: [], notes: [] };
            augustData[currentActiveId].tileColor = colorKey;
            localStorage.setItem('augustStructuredData', JSON.stringify(augustData));
        }

        function exportBackup() {
            forceSaveInline();
            const backupData = {
                augustStructuredData: augustData,
                globalTileTheme: localStorage.getItem('globalTileTheme') || 'default',
                exportDate: new Date().toISOString()
            };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `planner-backup-${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function processImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.augustStructuredData) {
                        augustData = parsed.augustStructuredData;
                        localStorage.setItem('augustStructuredData', JSON.stringify(augustData));
                    }
                    if (parsed.globalTileTheme) {
                        localStorage.setItem('globalTileTheme', parsed.globalTileTheme);
                        applyGlobalThemeVars(parsed.globalTileTheme);
                    }
                    alert("Backup restored successfully!");
                    loadMonth('aug');
                } catch (err) {
                    alert("Invalid backup file format.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function loadMonth(monthId) {
            forceSaveInline();
            currentActiveId = monthId + '-grid';
            renderCalendarSpread();
            document.getElementById('inputBar').style.display = 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + monthId).classList.add('active');
        }

        function renderCalendarSpread() {
            let gridHtml = '';
            let rowCells = 0;
            let isFirstRow = true;
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const savedTheme = localStorage.getItem('globalTileTheme') || 'default';

            for (let d = 1; d <= 31; d++) {
                let dow = new Date(2026, 7, d).getDay(); 
                
                if (dow > 0 && dow < 6) { 
                    if (isFirstRow) {
                        for (let i = 1; i < dow; i++) {
                            gridHtml += `<div class="cal-tile muted"><div class="tile-header-area" style="background:#fafafa; border-bottom: none;"><div class="tile-date">${days[i]}</div></div></div>`;
                            rowCells++;
                        }
                        isFirstRow = false;
                    }

                    gridHtml += buildSequentialTileHTML('aug', d, dow);
                    rowCells++;
                }
            }

            while (rowCells % 5 !== 0) {
                let currentDowIdx = (rowCells % 5) + 1; 
                gridHtml += `<div class="cal-tile muted"><div class="tile-header-area" style="background:#fafafa; border-bottom: none;"><div class="tile-date">${days[currentDowIdx]}</div></div></div>`;
                rowCells++;
            }

            let fullHtml = `
                <div class="content-block active" style="display:flex; flex-direction:column; flex:1;">
                    <div class="header">
                        <div class="header-title-group" style="display: flex; width: 100%; justify-content: space-between; align-items: flex-end;">
                            <div>
                                <h2 class="cursive-title">August 2026</h2>
                            </div>
                            
                            <div class="header-controls">
                                <button class="btn-action btn-secondary" onclick="exportBackup()" title="Download Backup">💾 Backup</button>
                                <button class="btn-action btn-secondary" onclick="triggerImport()" title="Restore Backup">📂 Restore</button>
                                <select class="theme-select" id="globalThemeSelect" onchange="changeGlobalTheme(this.value)">
                                    ${themeOptionsHtml}
                                </select>
                                <button class="btn-action" onclick="openIdeas()">💡 BIG IDEAS</button>
                            </div>
                        </div>
                    </div>
                    
                    <div style="display:grid; grid-template-columns: repeat(5, 1fr); margin-bottom: 2px; text-align: center; font-weight: bold; color: #777; font-size: 0.8rem;">
                        <div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div>
                    </div>
                    
                    <div class="simple-grid">
                        ${gridHtml}
                    </div>
                </div>
            `;
            
            document.getElementById('content-area').innerHTML = fullHtml;
            document.getElementById('globalThemeSelect').value = savedTheme;
        }

        function buildSequentialTileHTML(monthId, dayNum, dow) {
            const dayKey = `${monthId}-d${dayNum}`;
            const data = augustData[dayKey] || { tasks: [], notes: [] };
            
            let inlineStyle = '';
            if (data.tileColor && data.tileColor !== 'global') {
                const theme = themePalette[data.tileColor];
                if (theme) inlineStyle = `background-color: ${theme.bg}; color: ${theme.text};`;
            }

            let snippetHtml = "";
            data.tasks.forEach(t => { 
                const displayTitle = t.title || "Task";
                if (t.done) snippetHtml += `<span class="tile-task-snippet" style="text-decoration: line-through; opacity: 0.5;">✓ ${displayTitle}</span>`; 
                else snippetHtml += `<span class="tile-task-snippet">☐ ${displayTitle}</span>`; 
            });
            data.notes.forEach(n => { 
                const displayTitle = n.title || "Note"; 
                snippetHtml += `<span class="tile-note-snippet">• ${displayTitle}</span>`; 
            });

            return `
                <div class="cal-tile" onclick="openDay('${monthId}', ${dayNum})">
                    <div class="tile-header-area" style="${inlineStyle}">
                        <div class="tile-date">${dayNum}</div>
                    </div>
                    <div class="tile-content-area">
                        <div class="tile-previews">${snippetHtml}</div>
                    </div>
                </div>
            `;
        }

        function openDay(monthId, dayNum) {
            forceSaveInline();
            currentActiveId = `${monthId}-d${dayNum}`;
            
            let templateWrapper = document.createElement('div');
            templateWrapper.innerHTML = document.getElementById('data-empty-day').innerHTML;
            
            const dateObj = new Date(2026, 7, dayNum);
            const fullDateStr = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            templateWrapper.querySelector('#dynamic-day-title').innerText = fullDateStr;
            
            const selectHtml = `<option value="global">Use Global Theme</option>` + themeOptionsHtml;
            const overrideSelect = templateWrapper.querySelector('#overrideThemeSelect');
            overrideSelect.innerHTML = selectHtml;
            
            const data = augustData[currentActiveId] || { tasks: [], notes: [] };
            if (data.tileColor) overrideSelect.value = data.tileColor;
            else overrideSelect.value = "global";

            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `<div class="content-block active" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">${templateWrapper.innerHTML}</div>`;

            const btnCarryOver = contentArea.querySelector('#btn-carry-over');
            if (btnCarryOver) btnCarryOver.setAttribute('onclick', `carryOverTasks('${monthId}', ${dayNum})`);

            populateEntries(currentActiveId, contentArea);

            const navBar = contentArea.querySelector('#dynamic-page-nav');
            if (navBar) {
                let prevDay = dayNum - 1;
                let nextDay = dayNum + 1;
                let prevHtml = prevDay > 0 ? `<button class="nav-btn" onclick="openDay('${monthId}', ${prevDay})">← Prev Day</button>` : `<div></div>`;
                let nextHtml = nextDay <= 31 ? `<button class="nav-btn" onclick="openDay('${monthId}', ${nextDay})">Next Day →</button>` : `<div></div>`;
                navBar.innerHTML = prevHtml + nextHtml;
            }

            document.getElementById('inputBar').style.display = 'flex';
        }

        function openIdeas() {
            forceSaveInline();
            currentActiveId = 'ideas-global';
            
            let templateWrapper = document.createElement('div');
            templateWrapper.innerHTML = document.getElementById('data-empty-day').innerHTML;
            
            templateWrapper.querySelector('#dynamic-day-title').innerText = "💡 GLOBAL IDEAS & REFERENCE VAULT";
            templateWrapper.querySelector('#day-override-control').remove();
            
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `<div class="content-block active" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">${templateWrapper.innerHTML}</div>`;

            const btnCarryOver = contentArea.querySelector('#btn-carry-over');
            if (btnCarryOver) btnCarryOver.remove();
            
            const navBar = contentArea.querySelector('#dynamic-page-nav');
            if (navBar) navBar.innerHTML = `<div></div>`;

            populateEntries(currentActiveId, contentArea);
            
            document.getElementById('entryTag').value = "Ideas";
            document.getElementById('inputBar').style.display = 'flex';
        }

        // --- UPDATED: POPULATE ENTRIES WITH DELETE BUTTON ---
        function populateEntries(keyId, contentArea) {
            const data = augustData[keyId] || { tasks: [], notes: [] };
            
            const tasksContainer = contentArea.querySelector('.tasks-container');
            data.tasks.forEach(t => {
                tasksContainer.insertAdjacentHTML('beforeend', `
                    <div class="task-item">
                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="handleTaskToggle(this)"> 
                        <div class="entry-content-wrapper" style="${t.done ? 'opacity: 0.5;' : ''}">
                            <span class="entry-title" style="${t.done ? 'text-decoration: line-through;' : ''}">${t.title}</span>
                            ${t.details ? `<span class="entry-details">${t.details}</span>` : ''}
                        </div>
                        <span class="item-tags">${t.tag}</span>
                        <button class="delete-btn" onclick="deleteEntry(this)" title="Delete Entry">&times;</button>
                    </div>
                `);
            });

            const notesContainer = contentArea.querySelector('.notes-container');
            data.notes.forEach(n => {
                notesContainer.insertAdjacentHTML('beforeend', `
                    <div class="note-item">
                        <div class="entry-content-wrapper">
                            <span class="entry-title">${n.title}</span>
                            ${n.details ? `<span class="entry-details">${n.details}</span>` : ''}
                        </div>
                        <span class="item-tags">${n.tag}</span>
                        <button class="delete-btn" onclick="deleteEntry(this)" title="Delete Entry">&times;</button>
                    </div>
                `);
            });
        }

        // --- NEW: DELETE ENTRY LOGIC ---
        function deleteEntry(btn) {
            if(confirm("Are you sure you want to delete this entry?")) {
                const entry = btn.closest('.task-item') || btn.closest('.note-item');
                if (entry) {
                    entry.remove();
                    extractAndSaveData();
                }
            }
        }

        function loadSearchPage() {
            forceSaveInline();
            currentActiveId = 'search-page';
            
            const contentArea = document.getElementById('content-area');
            const template = document.getElementById('data-search-page').innerHTML;
            contentArea.innerHTML = `<div class="content-block active" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">${template}</div>`;
            
            document.getElementById('inputBar').style.display = 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-search').classList.add('active');
        }

        function runGlobalSearch() {
            const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResultsContainer');
            
            if (query === '') {
                resultsContainer.innerHTML = `<p style="color: #777; font-size: 1rem; font-style: italic;">Type above to search all records and ideas...</p>`;
                return;
            }

            let matchesFound = [];

            for (const [dayKey, dayData] of Object.entries(augustData)) {
                let dateString = "";
                let clickAction = "";

                if (dayKey === 'ideas-global') {
                    dateString = "💡 BIG IDEAS VAULT";
                    clickAction = `openIdeas()`;
                } else if (dayKey.includes('-d')) {
                    const dayNum = dayKey.split('-d')[1];
                    const dateObj = new Date(2026, 7, dayNum);
                    dateString = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                    clickAction = `openDay('aug', ${dayNum})`;
                } else {
                    continue;
                }

                if (dayData.tasks) {
                    dayData.tasks.forEach(t => {
                        if (t.title.toLowerCase().includes(query) || (t.details && t.details.toLowerCase().includes(query)) || t.tag.toLowerCase().includes(query)) {
                            matchesFound.push({ clickAction, dateString, type: 'Action', text: t.title, tag: t.tag });
                        }
                    });
                }
                if (dayData.notes) {
                    dayData.notes.forEach(n => {
                        if (n.title.toLowerCase().includes(query) || (n.details && n.details.toLowerCase().includes(query)) || n.tag.toLowerCase().includes(query)) {
                            matchesFound.push({ clickAction, dateString, type: 'Note', text: n.title, tag: n.tag });
                        }
                    });
                }
            }

            if (matchesFound.length === 0) {
                resultsContainer.innerHTML = `<p style="color: #c0392b; font-size: 1rem;">No matching records found for "<b>${query}</b>"</p>`;
                return;
            }

            let resultsHtml = `<p style="font-size: 0.95rem; color: #555; margin-bottom: 5px;">Found <b>${matchesFound.length}</b> match(es):</p>`;
            matchesFound.forEach(m => {
                resultsHtml += `
                    <div style="background: #fff; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-light); cursor: pointer; transition: border-color 0.2s;" onclick="${m.clickAction}">
                        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--green-accent); font-weight: bold; margin-bottom: 4px;">
                            <span>${m.dateString}</span>
                            <span style="background: #eee; padding: 2px 8px; border-radius: 4px; color: #555;">${m.type} [${m.tag}]</span>
                        </div>
                        <div style="font-size: 1.05rem; color: #222; font-weight: 600;">${m.text}</div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = resultsHtml;
        }

        function carryOverTasks(monthId, dayNum) {
            forceSaveInline();
            const currentKey = `${monthId}-d${dayNum}`;
            const nextDayNum = dayNum + 1;
            
            if (nextDayNum > 31) { alert("Cannot carry over past the 31st."); return; }
            const nextKey = `${monthId}-d${nextDayNum}`;
            
            let currentData = augustData[currentKey] || { tasks: [], notes: [] };
            let nextData = augustData[nextKey] || { tasks: [], notes: [] };

            const completedTasks = [];
            const unfinishedTasks = [];

            currentData.tasks.forEach(t => {
                if (t.done) completedTasks.push(t);
                else unfinishedTasks.push(t);
            });

            if (unfinishedTasks.length === 0) { alert("All caught up! No open tasks to carry over."); return; }

            currentData.tasks = completedTasks;
            augustData[currentKey] = currentData;
            nextData.tasks = nextData.tasks.concat(unfinishedTasks);
            augustData[nextKey] = nextData;

            localStorage.setItem('augustStructuredData', JSON.stringify(augustData));
            openDay(monthId, dayNum); 
        }

        function handleTaskToggle(checkbox) {
            const taskItem = checkbox.closest('.task-item');
            const wrapper = taskItem.querySelector('.entry-content-wrapper');
            const title = taskItem.querySelector('.entry-title');
            
            if (checkbox.checked) {
                title.style.textDecoration = 'line-through';
                wrapper.style.opacity = '0.5';
            } else {
                title.style.textDecoration = 'none';
                wrapper.style.opacity = '1';
            }
            extractAndSaveData();
        }

        function toggleInput(type) {
            const taskBtn = document.getElementById('btn-add-task');
            const noteBtn = document.getElementById('btn-add-note');

            if (activeInputType === type) { saveInlineEntry(type); return; }
            if (activeInputType !== null) { saveInlineEntry(activeInputType); }

            activeInputType = type;
            const contentArea = document.getElementById('content-area');
            const targetClass = type === 'task' ? '.tasks-container' : '.notes-container';
            const targetContainer = contentArea.querySelector(targetClass);
            if (!targetContainer) return;

            const placeholderTitle = type === 'task' ? 'Header Reference...' : 'Header Reference...';
            const placeholderDetails = type === 'task' ? 'Action details...' : 'Log notes...';
            
            const inputHtml = `
                <div class="dynamic-input-group" id="inlineInputGroup">
                    <input type="text" id="inlineTitle" class="dynamic-title-input" placeholder="${placeholderTitle}">
                    <textarea id="inlineDetails" class="dynamic-details-input" placeholder="${placeholderDetails}"></textarea>
                </div>
            `;
            targetContainer.insertAdjacentHTML('beforeend', inputHtml);
            
            const inlineTitle = document.getElementById('inlineTitle');
            const inlineDetails = document.getElementById('inlineDetails');
            inlineTitle.focus();

            inlineDetails.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            if (type === 'task') {
                taskBtn.innerText = "✓ Save Action";
                taskBtn.style.backgroundColor = "#2b3623";
            } else {
                noteBtn.innerText = "✓ Save Note";
                noteBtn.style.backgroundColor = "#82652b";
            }
            
            contentArea.scrollTop = contentArea.scrollHeight;
        }

        // --- UPDATED: ADD DELETE BUTTON TO NEW INLINE ENTRIES ---
        function saveInlineEntry(type) {
            const inputGroup = document.getElementById('inlineInputGroup');
            if (!inputGroup) { resetButtons(); return; }

            const titleText = document.getElementById('inlineTitle').value.trim();
            const detailsText = document.getElementById('inlineDetails').value.trim();
            const tag = document.getElementById('entryTag').value;
            const targetContainer = inputGroup.parentElement;
            
            inputGroup.remove();
            resetButtons();
            activeInputType = null;

            if (titleText !== '') {
                if (type === 'task') {
                    targetContainer.insertAdjacentHTML('beforeend', `
                        <div class="task-item">
                            <input type="checkbox" onchange="handleTaskToggle(this)"> 
                            <div class="entry-content-wrapper">
                                <span class="entry-title">${titleText}</span>
                                ${detailsText ? `<span class="entry-details">${detailsText}</span>` : ''}
                            </div>
                            <span class="item-tags">${tag}</span>
                            <button class="delete-btn" onclick="deleteEntry(this)" title="Delete Entry">&times;</button>
                        </div>
                    `);
                } else {
                    targetContainer.insertAdjacentHTML('beforeend', `
                        <div class="note-item">
                            <div class="entry-content-wrapper">
                                <span class="entry-title">${titleText}</span>
                                ${detailsText ? `<span class="entry-details">${detailsText}</span>` : ''}
                            </div>
                            <span class="item-tags">${tag}</span>
                            <button class="delete-btn" onclick="deleteEntry(this)" title="Delete Entry">&times;</button>
                        </div>
                    `);
                }
                extractAndSaveData();
            }
        }

        function resetButtons() {
            const taskBtn = document.getElementById('btn-add-task');
            const noteBtn = document.getElementById('btn-add-note');
            taskBtn.innerText = "+ Action Item";
            taskBtn.style.backgroundColor = "var(--green-accent)";
            noteBtn.innerText = "+ Note";
            noteBtn.style.backgroundColor = "var(--gold-accent)";
        }

        function forceSaveInline() {
            if (activeInputType !== null) saveInlineEntry(activeInputType);
        }

        function extractAndSaveData() {
            forceSaveInline();
            if (!currentActiveId.includes('-d') && currentActiveId !== 'ideas-global') return;

            const contentArea = document.getElementById('content-area');
            const tasks = [];
            const notes = [];

            contentArea.querySelectorAll('.task-item').forEach(item => {
                tasks.push({
                    title: item.querySelector('.entry-title').innerText,
                    details: item.querySelector('.entry-details') ? item.querySelector('.entry-details').innerText : '',
                    tag: item.querySelector('.item-tags').innerText,
                    done: item.querySelector('input[type="checkbox"]').checked
                });
            });

            contentArea.querySelectorAll('.note-item').forEach(item => {
                notes.push({
                    title: item.querySelector('.entry-title').innerText,
                    details: item.querySelector('.entry-details') ? item.querySelector('.entry-details').innerText : '',
                    tag: item.querySelector('.item-tags').innerText
                });
            });

            const existingData = augustData[currentActiveId] || {};
            const tileColor = existingData.tileColor;
            
            augustData[currentActiveId] = { tasks, notes };
            if (tileColor) augustData[currentActiveId].tileColor = tileColor;
            
            localStorage.setItem('augustStructuredData', JSON.stringify(augustData));
        }
    </script>
</body>
</html>
